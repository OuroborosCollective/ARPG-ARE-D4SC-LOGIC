document.addEventListener("click", async e => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn){ switchTab(tabBtn.dataset.tab); return; }
  const mode = e.target.closest("[data-mode]");
  if (mode){
    S.mapMode = mode.dataset.mode;
    document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === S.mapMode));
    // Beim Setzen/Verschieben braucht man die ganze Karte – Detailkarte zuklappen
    if (S.mapMode !== "view" && S.sel){ S.sel = null; refreshMapPanel(); drawMap(); }
    updateMapHint();
    return;
  }
  const open = e.target.closest("[data-open]");
  if (open){ openEditor(open.dataset.open, open.dataset.id); return; }
  const iss = e.target.closest("[data-issue]");
  if (iss){
    const i = S.state.issues[+iss.dataset.issue];
    if (!i || !i.id) return;
    if (i.kind === "marker"){ S.sel = { kind: "marker", id: i.id }; switchTab("map"); return; }
    if (["npc","quest","dialogue","kit","item"].includes(i.kind)) openEditor(i.kind, i.id);
    return;
  }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const d = a.dataset, D = S.draft;
  switch (d.act){
    case "login": { const t = ($("#tok").value || "").trim(); if (!t) return; S.token = t; try { localStorage.setItem("fw.token", t); } catch (x) {} render(); poll(true); break; }
    case "logout": if (S.token === "proxy"){ location.reload(); break; } if (confirm("Abmelden?")) logout(); break;
    case "createDb": await act("/api/db/create", {}, "Datenbank angelegt."); break;
    case "saveScene": await act("/api/scene/save", {}, "In Unity gespeichert."); break;
    case "new": {
      const kind = KIND_OF_TAB[S.tab];
      if (kind === "quest") openDraft("quest", blankQuest());
      if (kind === "dialogue") openDraft("dialogue", blankDialogue(""));
      if (kind === "kit") openDraft("kit", blankKit(""));
      if (kind === "item") openDraft("item", blankItem());
      break;
    }
    case "closeEditor": if (!S.draftDirty || confirm("Ungespeicherte Änderungen verwerfen?")) closeEditor(); break;
    case "saveDraft": await saveDraft(); break;
    case "deleteDraft": await deleteDraft(); break;
    case "reloadDraft": { const f = currentRemote(); if (f){ S.draft = clone(f); S.draftBase = JSON.stringify(f); S.draftDirty = false; S.remoteChanged = false; renderEditor(); } break; }
    case "openRef":
      if (S.draftDirty && S.draft && !(S.draftKind === d.kind && S.draft.id === d.id) && !confirm("Ungespeicherte Änderungen verwerfen?")) return;
      S.draftDirty = false; openEditor(d.kind, d.id); break;
    case "selectInUnity": await act("/api/entity/select", { kind: d.kind, id: d.id }, "In Unity ausgewählt."); break;
    case "showOnMap": S.sel = { kind: d.kind, id: d.id }; switchTab("map"); { const o = S.idx[d.kind === "npc" ? "npcs" : "markers"].get(d.id); if (o && S.view){ S.view.cu = o.u; S.view.cv = o.v; drawMap(); } } break;
    case "deleteEntity": {
      const msg = d.kind === "npc" ? "Fadenwerk-Komponente von diesem NPC entfernen? Die Figur bleibt in der Szene." : "Marker löschen?";
      if (!confirm(msg)) return;
      const r = await act("/api/entity/delete", { kind: d.kind, id: d.id }, "Entfernt.");
      if (r){ S.sel = null; if (S.draftKind === "npc") closeEditor(); refreshMapPanel(); drawMap(); }
      break;
    }
    case "newQuestFor": { const q = blankQuest(d.id); const n = S.idx.npcs.get(d.id); q.id = newId("q", n ? n.name : "quest"); openDraft("quest", q); break; }
    case "genDialogue": {
      const n = S.draft; if (!n) return;
      if (n.dialogueId && S.idx.dialogues.has(n.dialogueId) && !confirm("Dieser NPC hat schon einen Dialog. Einen neuen erzeugen und nach dem Übertragen zuweisen?")) return;
      const src = S.idx.npcs.get(n.id) || n;
      const merged = Object.assign({}, src, { lore: n.lore, name: n.name });
      S.draftDirty = false;
      openDraft("dialogue", generateDialogue(merged), { assignDialogueTo: n.id });
      toast("Dialog erzeugt – prüfen und „Übertragen“ tippen.", "ok");
      break;
    }
    case "newKitForQuest": {
      if (!D) return;
      const questId = D.id;
      if (S.draftNew || S.draftDirty){ toast("Bitte die Quest zuerst übertragen.", "warn"); return; }
      openDraft("kit", blankKit((D.title || "Quest") + " – Belohnung"), { assignKitToQuest: questId });
      break;
    }
    case "focusQuestMap": S.focusQuest = d.id; { const q = S.idx.quests.get(d.id); S.sel = q && q.giverNpcId ? { kind: "npc", id: q.giverNpcId } : null; } switchTab("map"); break;
    case "addObj": D.objectives.push({ type: "talk", targetId: "", count: 1, text: "" }); markDirty(); renderEditor(); break;
    case "rmObj": D.objectives.splice(+d.i, 1); markDirty(); renderEditor(); break;
    case "mvObj": { const i = +d.i, j = i + (+d.d); [D.objectives[i], D.objectives[j]] = [D.objectives[j], D.objectives[i]]; markDirty(); renderEditor(); break; }
    case "addPrereq": D.prerequisiteQuestIds.push(""); markDirty(); renderEditor(); break;
    case "rmPrereq": D.prerequisiteQuestIds.splice(+d.i, 1); markDirty(); renderEditor(); break;
    case "addNode": D.nodes.push({ id: uniqueNodeId(D, "knoten"), speaker: "", text: "", choices: [] }); markDirty(); renderEditor(); scrollToNode(D.nodes[D.nodes.length - 1].id); break;
    case "addNodeFrom": {
      const nid = uniqueNodeId(D, "knoten");
      D.nodes.push({ id: nid, speaker: "", text: "", choices: [] });
      D.nodes[+d.i].choices.push({ ...blankChoice(), nextNodeId: nid });
      markDirty(); renderEditor(); break;
    }
    case "rmNode": {
      const gone = D.nodes[+d.i].id;
      D.nodes.splice(+d.i, 1);
      D.nodes.forEach(n => n.choices.forEach(c => { if (c.nextNodeId === gone) c.nextNodeId = ""; }));
      if (D.startNodeId === gone) D.startNodeId = D.nodes[0] ? D.nodes[0].id : "";
      markDirty(); renderEditor(); break;
    }
    case "addChoice": D.nodes[+d.i].choices.push(blankChoice()); markDirty(); renderEditor(); break;
    case "rmChoice": D.nodes[+d.i].choices.splice(+d.k, 1); markDirty(); renderEditor(); break;
    case "previewDialogue": previewDialogue(D); break;
    case "addEntry": D.entries.push({ itemId: "", minQuantity: 1, maxQuantity: 1, weight: 100, guaranteed: false }); markDirty(); renderEditor(); break;
    case "rmEntry": D.entries.splice(+d.i, 1); markDirty(); renderEditor(); break;
    case "rollNext": { const s = $("#rollSeed"); const m2 = (s.value || "test-1").match(/^(.*?)(\d+)$/); s.value = m2 ? m2[1] + (+m2[2] + 1) : s.value + "-2"; } /* falls through */
    case "rollKit": {
      if (S.draftDirty){ toast("Erst übertragen, dann würfeln – sonst würfelt Unity den alten Stand.", "warn"); return; }
      const seed = $("#rollSeed").value; S.rollSeed = seed;
      try {
        const r = await api("/api/kit/roll", { id: D.id, seed });
        $("#rollOut").innerHTML = `<div class="card" style="margin-top:8px"><div><b>${r.gold}</b> Gold · <b>${r.xp}</b> XP</div>${r.items.length ? `<div class="chips" style="margin-top:6px">${r.items.map(x => `<span class="chip acc">${x.quantity}× ${esc(x.displayName)}</span>`).join("")}</div>` : `<div class="muted">keine Gegenstände</div>`}</div>`;
      } catch (x) { toast(x.message, "err"); }
      break;
    }
    case "pickAsset": openAssetPicker("prefab", a2 => { D.assetGuid = a2.guid; D.assetPath = a2.path; D.assetName = a2.name; D.assetType = a2.type; if (!D.displayName) D.displayName = a2.name; if (S.draftNew && !D.id) D.id = slug(a2.name); markDirty(); renderEditor(); }); break;
    case "clearAsset": D.assetGuid = ""; D.assetPath = ""; D.assetName = ""; D.assetType = ""; markDirty(); renderEditor(); break;
    case "importFolder": openFolderImport(); break;
    case "folderImport": {
      const f = $("#fldSel").value; if (!f){ toast("Bitte einen Ordner auswählen.", "warn"); return; }
      const r = await act("/api/items/import", { folder: f, category: $("#fldCat").value, rarity: $("#fldRar").value });
      if (r){ toast(r.added + " Item(s) übernommen.", r.added ? "ok" : "warn"); closeModal(); }
      break;
    }
    case "candidates": openCandidates(); break;
    case "convert": { const r = await act("/api/npc/convert", { goid: d.goid }, "NPC angelegt."); if (r){ closeModal(); if (r.id) openEditor("npc", r.id); } break; }
    case "closeModal": closeModal(); break;
    case "fitMap": fitMap(); break;
    case "toggleLinks": S.showLinks = !S.showLinks; a.classList.toggle("ok", S.showLinks); if (!S.showLinks) S.focusQuest = ""; drawMap(); break;
    case "mapMenu": modal("Kartenhintergrund", `<div class="hint">Unity rendert eine Draufsicht als Hintergrund. Das dauert je nach Szene ein paar Sekunden.</div>
        <button class="btn pri" data-act="renderAuto">Ganze Szene rendern</button>
        <button class="btn" data-act="renderView">Sichtbaren Ausschnitt rendern (schärfer)</button>
        ${S.focusQuest ? `<button class="btn" data-act="clearFocus">Quest-Hervorhebung aufheben</button>` : ""}`); break;
    case "clearFocus": S.focusQuest = ""; closeModal(); drawMap(); break;
    case "renderAuto": closeModal(); toast("Unity rendert die Karte …", "ok"); if (await act("/api/map/render", { mode: "auto", size: 1536 }, "Karte aktualisiert.")){ S.view = null; if (S.tab === "map") fitMap(); } break;
    case "renderView": {
      closeModal();
      const c = $("#map"); const [u0, v1] = s2w(0, 0), [u1, v0] = s2w(c.clientWidth, c.clientHeight);
      toast("Unity rendert den Ausschnitt …", "ok");
      await act("/api/map/render", { mode: "area", minU: u0, minV: v0, maxU: u1, maxV: v1, size: 1536 }, "Karte aktualisiert.");
      break;
    }
    case "closeSel": S.sel = null; refreshMapPanel(); drawMap(); break;
    case "saveMarker": {
      const p = $("#mappanel"); const g = k => p.querySelector(`[data-mk="${k}"]`);
      await act("/api/marker/save", { markerId: d.id, label: g("label").value, kind: g("kind").value, radius: parseFloat(g("radius").value) || 2, autoReport: g("autoReport").checked }, "Marker übertragen.");
      refreshMapPanel(); break;
    }
    case "pickPrefab": {
      const pend = S.pending;
      const keepName = ($("#plName") || {}).value || "";
      openAssetPicker("prefab", a2 => { placeDialog("npc", pend.u, pend.v); S.pending.prefabGuid = a2.guid; S.pending.prefabName = a2.name; $("#plName").value = keepName || a2.name; $("#plPrefab").innerHTML = `Prefab: <b>${esc(a2.name)}</b>`; });
      break;
    }
    case "placeConfirm": await placeConfirm(); break;
    case "gameSetup": await act("/api/game/setup", {}, "Ashen-Datenbank geöffnet."); break;
    case "gamePublish": await act("/api/game/publish", {}, "Geprüfte Texte übernommen. Beim nächsten Spielstart verfügbar."); break;
    case "saveSeed": await act("/api/seed/save", { worldSeed: $("#seedInp").value }, "Seed übertragen."); break;
  }
});

function uniqueNodeId(d, base){ let i = d.nodes.length + 1, id = base + "_" + i; while (d.nodes.some(n => n.id === id)) id = base + "_" + (++i); return id; }
function scrollToNode(id){ setTimeout(() => { const el = document.getElementById("node-" + id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30); }

  if (t.dataset.search !== undefined){ S.search[t.dataset.search] = t.value; renderList(); return; }
  if (t.dataset.b && S.draft){ applyBinding(t); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.itemcat !== undefined){ S.itemCat = t.value; renderList(); return; }
  if (t.id === "sceneSel"){
    const path = t.value; if (!path) return;

    act("/api/scene/open", { path }, "Szene geöffnet.").then(() => { if (S.tab === "map") fitMap(); renderMain(); });
    return;
  }
  if (t.dataset.nodeId !== undefined && S.draft){
    const i = +t.dataset.nodeId, D = S.draft, old = D.nodes[i].id;
    const nid = t.value.trim().replace(/[^A-Za-z0-9_.:-]/g, "_");
    if (!nid || D.nodes.some((n, k) => k !== i && n.id === nid)){ toast("Knoten-ID leer oder schon vergeben.", "warn"); t.value = old; return; }
    D.nodes[i].id = nid;
    D.nodes.forEach(n => n.choices.forEach(c => { if (c.nextNodeId === old) c.nextNodeId = nid; }));
    if (D.startNodeId === old) D.startNodeId = nid;
    markDirty(); renderEditor(); return;
  }
  if (t.dataset.b && S.draft){
    applyBinding(t);
    if (t.dataset.rerender !== undefined) renderEditor();
  }
});
function applyBinding(t){
  let v;
  if (t.dataset.t === "bool") v = t.checked;
  else if (t.dataset.t === "int") v = t.value === "" ? 0 : Math.trunc(+t.value) || 0;
  else if (t.dataset.t === "float") v = t.value === "" ? 0 : +t.value || 0;
  else v = t.value;
  setPath(S.draft, t.dataset.b, v);
  if (S.draftKind === "item" && S.draftNew && t.dataset.b === "displayName" && !S.draft._idTouched){
    S.draft.id = slug(v);
    const idf = document.querySelector('[data-b="id"]'); if (idf) idf.value = S.draft.id;
  }
  if (t.dataset.b === "id") S.draft._idTouched = true;
  markDirty();
}

window.addEventListener("beforeunload", e => { if (S.draftDirty){ e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.token) poll(true); });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s"){ e.preventDefault(); if (S.draft) saveDraft(); else act("/api/scene/save", {}, "In Unity gespeichert."); }
  if (e.key === "Enter" && e.target.id === "tok") { const b = document.querySelector('[data-act="login"]'); if (b) b.click(); }
});

/* Link mit Schlüssel im selben Tab eingefügt: Seite lädt nicht neu, nur der #-Teil ändert sich */
window.addEventListener("hashchange", () => {
  if (!/[#&]t=/.test(location.hash)) return;
  readToken();
  S.state = null; S.rev = "";
  render();
  poll(true);
});

/* Start */
readToken();
render();
if (S.token) poll(true);
</script>
</body>
