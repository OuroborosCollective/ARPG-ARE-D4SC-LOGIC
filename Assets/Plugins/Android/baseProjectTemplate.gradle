buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    // Keep Unity's generated AGP declarations and build-script dependencies.
    id 'com.android.application' version '9.1.1' apply false
    id 'com.android.library' version '9.1.1' apply false
    **BUILD_SCRIPT_DEPS**
}

allprojects {
    repositories {
        // Unity normally supplies Google and Maven Central centrally via PREFER_SETTINGS.
        // Declare project-local repositories only when the settings explicitly prefer them.
        if (gradle.settings.dependencyResolutionManagement.repositoriesMode.get() == RepositoriesMode.PREFER_PROJECT) {
            google()
            mavenCentral()
        }
    }
}

project(':unityLibrary') {
    pluginManager.withPlugin('com.android.library') {
        dependencies {
            implementation "com.google.android.gms:play-services-games-v2:+"
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
