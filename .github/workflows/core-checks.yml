name: Core deterministic verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and execute the real shared C# simulation
        run: dotnet run --project Tests/CoreVerification/CoreVerification.csproj --configuration Release
      - name: Check repository has playable Unity entrypoint
        run: |
          test -f Assets/Scripts/Runtime/ArenaRuntime.cs
          test -f Assets/Editor/ArpgBuildTools.cs
          test -f ProjectSettings/ProjectVersion.txt
          grep -Fq '[RuntimeInitializeOnLoadMethod' Assets/Scripts/Runtime/ArenaRuntime.cs
      - name: Run Python static Unity and Android preflight (NOT Unity runtime)
        run: |
          python3 -m unittest discover -s Tests/Preflight -v
          python3 scripts/ci/unity_contract.py preflight
