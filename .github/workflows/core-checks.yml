name: Core deterministic verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and execute the real shared C# simulation
        run: dotnet run --project Tests/CoreVerification/CoreVerification.csproj --configuration Release
      - name: Verify real Fadenwerk JSON escaping and roundtrip
        run: dotnet run --project Tests/FadenwerkJsonVerification/FadenwerkJsonVerification.csproj --configuration Release
      - name: Verify World Forge map immutability
        run: dotnet run --project Tests/WorldForgeCoreVerification/WorldForgeCoreVerification.csproj --configuration Release
      - name: Verify Fadenwerk content rules without the Unity engine
        run: dotnet run --project Tests/FadenwerkValidatorVerification/FadenwerkValidatorVerification.csproj --configuration Release
      - name: Check repository has playable Unity entrypoint
        run: |
          test -f Assets/Scripts/Runtime/ArenaRuntime.cs
          test -f Assets/Editor/ArpgBuildTools.cs
          test -f ProjectSettings/ProjectVersion.txt
          grep -Fq '[RuntimeInitializeOnLoadMethod' Assets/Scripts/Runtime/ArenaRuntime.cs
      - name: Run Python static Unity and Android preflight (NOT Unity runtime)
        run: |
          python3 -m unittest discover -s Tests/Preflight -v
          python3 scripts/ci/unity_contract.py preflight
      - name: Verify Director skill routing (not engine or device execution)
        run: python3 -m unittest discover -s Tools/Director -v
      - name: Verify Fadenwerk gateway request policy (not browser or Unity execution)
        run: python3 -m unittest discover -s Tests/FadenwerkGateway -v

  neural-readonly-mcp:
    name: Neural Hub protocol and read-only advisor contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Verify bounded read-only Director bridge with real subprocess tests
        run: python3 -m unittest discover -s Tools/Director/neural_hub -p 'test_*.py' -v
      - name: Run 28-advisor unit and negative tests
        run: node --test Tools/Director/neural_hub/*.test.mjs
      - name: Install pinned mcp-use package without scripts
        working-directory: Tools/Director/neural_hub
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Run genuine legacy and modern MCP discovery, tool, prompt and Origin canaries
        working-directory: Tools/Director/neural_hub
        env:
          NEURAL_HUB_LOCAL_ONLY: '1'
        run: |
          export ASHEN_REPOSITORY_SHA="$(git rev-parse HEAD)"
          export ASHEN_ARCHITECTURE_SHA256="$(sha256sum ../../../docs/ARCHITECTURE.md | cut -d' ' -f1)"
          export ASHEN_CATALOG_SHA256="$(sha256sum ../neural_catalog.json | cut -d' ' -f1)"
          export ASHEN_SOURCES_SHA256="$(sha256sum upstream_sources.json | cut -d' ' -f1)"
          node mcp_canary.mjs
          printf '%s' '{"issues":[{"number":69,"state":"open","title":"WorldForge region connections","url":"https://github.com/OuroborosCollective/ARPG-ARE-D4SC-LOGIC/issues/69"}]}' > "$RUNNER_TEMP/ashen-issue69.json"
          ASHEN_ISSUES_FILE="$RUNNER_TEMP/ashen-issue69.json" node mcp_canary.mjs
          node mcp_modern_canary.mjs
      - name: Audit pinned package security advisories
        working-directory: Tools/Director/neural_hub
        run: npm audit --omit=optional --omit=dev --audit-level=high
