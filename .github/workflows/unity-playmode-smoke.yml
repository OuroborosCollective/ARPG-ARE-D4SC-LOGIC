name: Unity PlayMode smoke (licensed runner)

# This is an actual Unity engine test; it cannot be replaced by the .NET core checks.
# Manual until a Unity license/credentials have been configured for GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity-playmode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed if Unity credentials are not configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo 'Unity Editor test unavailable: set UNITY_LICENSE or both UNITY_EMAIL and UNITY_PASSWORD.' >&2
            exit 1
          fi
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: '2022.3.62f1'
          testMode: playmode
          artifactsPath: artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-playmode-smoke-results
          path: artifacts/
          if-no-files-found: warn